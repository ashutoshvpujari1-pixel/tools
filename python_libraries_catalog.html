<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200 flex flex-col">

            <!-- Mobile Search Bar -->
            <div class="sm:hidden mb-4">

                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">

            { id: 11, name: "SQLAlchemy", category: "Database", desc: "The Python SQL toolkit and Object Relational Mapper that gives developers full power of SQL.", snippet: "from sqlalchemy import create_engine, Column, Integer, String\nfrom sqlalchemy.ext.declarative import declarative_base\n\nengine = create_engine('sqlite:///:memory:')\nBase = declarative_base()\n\nclass User(Base):\n    __tablename__ = 'users'\n    id = Column(Integer, primary_key=True)\n    name = Column(String)" },

        // State variables
        let currentCategory = 'All';
        let searchQuery = '';

        function renderCategories() {
            const categoryList = document.getElementById('categoryList');
            const mobileSelect = document.getElementById('mobileCategorySelect');
            
            // Calculate category counts
            const counts = { All: pythonLibraries.length };
            pythonLibraries.forEach(lib => {
                counts[lib.category] = (counts[lib.category] || 0) + 1;
            });

            const categories = ['All', ...new Set(pythonLibraries.map(lib => lib.category))];
            
            // Render Desktop Sidebar
            categoryList.innerHTML = '';
            categories.forEach(cat => {
                const count = counts[cat] || 0;
                const isActive = cat === currentCategory;
                const btn = document.createElement('button');
                btn.className = `category-btn w-full flex items-center justify-between px-3 py-2 text-sm font-medium rounded-xl transition-colors ${
                    isActive 
                        ? 'bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 font-semibold' 
                        : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`;
                btn.innerHTML = `<span><i class="fa-solid fa-folder w-6 text-indigo-500/70"></i> ${cat}</span><span class="text-xs px-2 py-0.5 rounded-full ${isActive ? 'bg-indigo-100 dark:bg-indigo-900 text-indigo-600 dark:text-indigo-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'} font-semibold">${count}</span>`;
                btn.onclick = () => {
                    currentCategory = cat;
                    renderCategories();
                    renderLibraries();
                };
                categoryList.appendChild(btn);
            });

            // Render Mobile Select
            mobileSelect.innerHTML = '';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = `${cat} (${counts[cat]})`;
                if(cat === currentCategory) opt.selected = true;
                mobileSelect.appendChild(opt);
            });
        }

        function renderLibraries() {
            const grid = document.getElementById('librariesGrid');
            const emptyState = document.getElementById('emptyState');
            const libraryCount = document.getElementById('libraryCount');
            const activeFilterBadge = document.getElementById('activeFilterBadge');
            const filterBadgeText = document.getElementById('filterBadgeText');

            // Filter logic
            const filtered = pythonLibraries.filter(lib => {
                const matchesCat = currentCategory === 'All' || lib.category === currentCategory;
                const matchesSearch = lib.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      lib.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                      lib.snippet.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            libraryCount.textContent = filtered.length;

            if(currentCategory !== 'All' || searchQuery !== '') {
                activeFilterBadge.classList.remove('hidden');
                activeFilterBadge.classList.add('flex');
                filterBadgeText.textContent = currentCategory !== 'All' ? `Category: ${currentCategory}` : `Search: "${searchQuery}"`;
            } else {
                activeFilterBadge.classList.add('hidden');
                activeFilterBadge.classList.remove('flex');
            }

            if(filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = '';

            filtered.forEach(lib => {
                const card = document.createElement('div');
                card.className = 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-sm flex flex-col justify-between hover:shadow-md transition-shadow';
                
                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between gap-3 mb-2">
                            <div>
                                <h4 class="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                                    ${lib.name}
                                </h4>
                                <span class="inline-block text-xs font-semibold px-2.5 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-indigo-600 dark:text-indigo-400 mt-1">
                                    ${lib.category}
                                </span>
                            </div>
                            <span class="text-xs font-mono text-slate-400">#${lib.id}</span>
                        </div>
                        <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mb-4">${lib.desc}</p>
                        
                        <!-- Code Snippet Box -->
                        <div class="relative rounded-xl bg-slate-900 text-slate-200 p-3.5 font-mono text-xs overflow-x-auto border border-slate-800 mb-4 group">
                            <pre class="whitespace-pre"><code>${escapeHtml(lib.snippet)}</code></pre>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-800/80">
                        <div class="flex items-center space-x-1.5">
                            <button onclick="copySnippet(${lib.id})" class="inline-flex items-center space-x-1 text-xs font-medium px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600 dark:hover:bg-indigo-950 dark:hover:text-indigo-400 transition-colors" title="Copy to clipboard">
                                <i class="fa-regular fa-copy"></i>
                                <span class="hidden sm:inline">Copy</span>
                            </button>
                            <button onclick="downloadSnippet(${lib.id})" class="inline-flex items-center space-x-1 text-xs font-medium px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600 dark:hover:bg-indigo-950 dark:hover:text-indigo-400 transition-colors" title="Download .py file">
                                <i class="fa-solid fa-download"></i>
                                <span class="hidden sm:inline">Download</span>
                            </button>
                        </div>
                        <div class="flex items-center space-x-1.5">
                            <button onclick="emailSnippet(${lib.id})" class="inline-flex items-center space-x-1 text-xs font-medium px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600 dark:hover:bg-indigo-950 dark:hover:text-indigo-400 transition-colors" title="Email snippet">
                                <i class="fa-solid fa-envelope"></i>
                                <span class="hidden sm:inline">Email</span>
                            </button>
                            <button onclick="shareSnippet(${lib.id})" class="inline-flex items-center space-x-1 text-xs font-medium px-2.5 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-indigo-50 hover:text-indigo-600 dark:hover:bg-indigo-950 dark:hover:text-indigo-400 transition-colors" title="Share snippet">
                                <i class="fa-solid fa-share-nodes"></i>
                                <span class="hidden sm:inline">Share</span>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function showToast(message, iconClass = "fa-solid fa-circle-check text-emerald-400") {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            toastMessage.textContent = message;
            toastIcon.className = iconClass;

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Action Handlers
        function copySnippet(id) {
            const lib = pythonLibraries.find(l => l.id === id);
            if (!lib) return;
            
            // Fallback clipboard method complying with iFrame constraints
            const textarea = document.createElement('textarea');
            textarea.value = lib.snippet;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(`Copied ${lib.name} snippet to clipboard!`);
            } catch (err) {
                showToast('Failed to copy snippet', 'fa-solid fa-triangle-exclamation text-amber-400');
            }
            document.body.removeChild(textarea);
        }

        function downloadSnippet(id) {
            const lib = pythonLibraries.find(l => l.id === id);
            if (!lib) return;

            const blob = new Blob([lib.snippet], { type: 'text/x-python' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${lib.name.toLowerCase().replace(/[^a-z0-9]/g, '_')}_snippet.py`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`Downloaded ${lib.name} snippet as .py!`);
        }

        function emailSnippet(id) {
            const lib = pythonLibraries.find(l => l.id === id);
            if (!lib) return;

            const subject = encodeURIComponent(`Python Snippet: ${lib.name} (${lib.category})`);
            const body = encodeURIComponent(`Check out this code snippet for ${lib.name} (${lib.desc}):\n\n${lib.snippet}\n\nShared via PyVault.`);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        function shareSnippet(id) {
            const lib = pythonLibraries.find(l => l.id === id);
            if (!lib) return;

            if (navigator.share) {
                navigator.share({
                    title: `${lib.name} Python Snippet`,
                    text: `Check out the ${lib.name} snippet:`,
                    url: window.location.href,
                }).catch(() => {});
            } else {
                copySnippet(id);
                showToast(`Link/Snippet copied for sharing!`);
            }
        }

        // Event Listeners setup
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderLibraries();
        });

        document.getElementById('mobileSearchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderLibraries();
        });

        document.getElementById('mobileCategorySelect').addEventListener('change', (e) => {
            currentCategory = e.target.value;
            renderCategories();
            renderLibraries();
        });

        document.getElementById('clearFilter').addEventListener('click', () => {
            currentCategory = 'All';
            searchQuery = '';
            document.getElementById('searchInput').value = '';
            document.getElementById('mobileSearchInput').value = '';
            renderCategories();
            renderLibraries();
        });

        // Theme Toggle logic
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        });

        // Initialize Theme from localStorage
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }

        // Initial render on load
        window.onload = function() {
            renderCategories();
            renderLibraries();
        };
    </script>
</body>
</html>
