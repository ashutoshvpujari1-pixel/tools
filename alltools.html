<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools Dashboard</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 3rem 1.5rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        h1 {
            font-size: 2.25rem;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: all 0.25s ease-in-out;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background-color: var(--primary);
            transition: width 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            border-color: #cbd5e1;
        }

        .card:hover::before {
            width: 8px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .card-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .card-action {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 0.35rem;
        }

        .loading, .message {
            text-align: center;
            grid-column: 1 / -1;
            font-size: 1.1rem;
            color: var(--text-secondary);
            padding: 3rem;
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .error {
            color: #dc2626;
            background: #fef2f2;
            border-color: #fee2e2;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🛠️ Tools Dashboard</h1>
            <p class="subtitle">Select a tool below to get started</p>
        </header>

        <div id="tools-grid" class="grid">
            <div class="loading">Scanning folder for available tools...</div>
        </div>
    </div>

    <script>
        async function loadTools() {
            const grid = document.getElementById('tools-grid');
            
            // Get the current file's name so we can exclude it from the list
            const currentFileName = window.location.pathname.split('/').pop();

            try {
                // Fetch the directory listing of the current folder
                const response = await fetch('./');
                if (!response.ok) throw new Error('Failed to read directory index.');
                
                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                // Extract all anchor links found in the directory layout
                const links = Array.from(doc.querySelectorAll('a'));
                const htmlFiles = new Set();

                links.forEach(link => {
                    let href = link.getAttribute('href');
                    if (!href) return;

                    // Decode URI formatting (e.g., handles spaces like "my%20tool.html")
                    try {
                        href = decodeURIComponent(href);
                    } catch (e) {}

                    // Clean query parameters or hashes if present
                    href = href.split('?')[0].split('#')[0];

                    // Filtering conditions:
                    // 1. Must end with .html or .htm
                    // 2. Must not be this current dashboard file
                    // 3. Must not be a parent directory link ('../')
                    // 4. Must not be an external absolute URL
                    if (
                        (href.endsWith('.html') || href.endsWith('.htm')) &&
                        href !== currentFileName &&
                        href !== './' &&
                        href !== '../' &&
                        !href.startsWith('http://') &&
                        !href.startsWith('https://')
                    ) {
                        htmlFiles.add(href);
                    }
                });

                if (htmlFiles.size === 0) {
                    grid.innerHTML = `<div class="message">No other HTML tools were found in this folder.</div>`;
                    return;
                }

                grid.innerHTML = ''; // Clear loading state

                // Build modern UI cards for each discovered HTML tool
                htmlFiles.forEach(file => {
                    // Turn "json-formatter.html" or "pdf_converter.html" into "Json Formatter" / "Pdf Converter"
                    let displayName = file
                        .replace(/\.html?$/, '')
                        .replace(/[-_]/g, ' ')
                        .replace(/\b\w/g, c => c.toUpperCase());

                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = file;
                    
                    card.innerHTML = `
                        <div>
                            <div class="card-title">${displayName}</div>
                            <div class="card-desc">Launch tool environment</div>
                        </div>
                        <div class="card-action">Open Tool &rarr;</div>
                    `;
                    grid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                grid.innerHTML = `
                    <div class="message error">
                        ⚠️ <strong>Unable to auto-scan folder contents.</strong><br><br>
                        <span style="font-size: 0.9rem; color: #475569;">
                            Browsers restrict directory indexing on local files (<code>file://</code>). Please run this via a local server (like VS Code <strong>Live Server</strong> or Python's <code>http.server</code>).
                        </span>
                    </div>
                `;
            }
        }

        window.addEventListener('DOMContentLoaded', loadTools);
    </script>
</body>
</html>
