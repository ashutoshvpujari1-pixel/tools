<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tools</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 30px;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.2);
        }

        .header h1 {
            margin: 0 0 8px;
            font-size: 30px;
        }

        .header p {
            margin: 0;
            opacity: 0.9;
        }

        .search {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
        }

        .search:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .tools {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }

        .tool {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .tool:hover {
            transform: translateY(-3px);
            border-color: #2563eb;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }

        .tool-icon {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .tool-name {
            font-size: 17px;
            font-weight: bold;
            color: #111827;
            word-break: break-word;
        }

        .tool-file {
            font-size: 13px;
            color: #6b7280;
            margin-top: 6px;
        }

        .status {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 15px;
            border-radius: 10px;
        }

        .count {
            margin-bottom: 15px;
            color: #6b7280;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .header {
                padding: 22px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🛠 HTML Tools</h1>
        <p>Select a tool below to open it.</p>
    </div>

    <input
        type="text"
        id="search"
        class="search"
        placeholder="🔍 Search tools..."
    >

    <div id="count" class="count"></div>

    <div id="tools" class="tools">
        <div class="status">Loading tools...</div>
    </div>

</div>

<script>
    /*
     * ============================================================
     * CONFIGURATION
     * ============================================================
     *
     * This page is expected to be hosted on GitHub Pages.
     *
     * Example:
     * https://username.github.io/my-tools/
     *
     * The script automatically determines:
     *   - GitHub username
     *   - Repository name
     *   - Current folder path
     *
     * No folder selection is required.
     */

    const currentFile =
        window.location.pathname.split("/").pop() || "index.html";

    const toolsContainer = document.getElementById("tools");
    const countElement = document.getElementById("count");
    const searchInput = document.getElementById("search");

    let tools = [];


    /*
     * Get GitHub repository information from the GitHub Pages URL.
     *
     * Example:
     *
     * username.github.io/repository/tools/index.html
     *
     * becomes:
     *
     * owner = username
     * repo  = repository
     * path  = tools
     */
    function getGitHubInfo() {

        const hostname = window.location.hostname;
        const pathname = window.location.pathname;

        if (!hostname.endsWith(".github.io")) {
            throw new Error(
                "This page must be hosted on GitHub Pages."
            );
        }

        const owner = hostname.split(".")[0];

        const parts = pathname
            .split("/")
            .filter(Boolean);

        if (hostname === owner + ".github.io") {

            if (parts.length === 0) {
                throw new Error(
                    "Unable to determine GitHub repository."
                );
            }

            const repo = parts[0];

            const folder = parts
                .slice(1, -1)
                .join("/");

            return {
                owner,
                repo,
                folder
            };

        } else {

            const repo = parts[0];

            const folder = parts
                .slice(1, -1)
                .join("/");

            return {
                owner,
                repo,
                folder
            };
        }
    }


    /*
     * Read HTML files from the current GitHub folder.
     */
    async function loadTools() {

        try {

            const github = getGitHubInfo();

            let apiUrl =
                `https://api.github.com/repos/${github.owner}/${github.repo}/contents`;

            if (github.folder) {
                apiUrl += "/" + github.folder;
            }

            const response = await fetch(apiUrl);

            if (!response.ok) {
                throw new Error(
                    `GitHub API error: ${response.status}`
                );
            }

            const files = await response.json();

            tools = files
                .filter(file => {

                    /*
                     * Only HTML files.
                     */
                    if (file.type !== "file") {
                        return false;
                    }

                    if (!file.name.toLowerCase().endsWith(".html")) {
                        return false;
                    }

                    /*
                     * Do not show this index page itself.
                     */
                    if (
                        file.name.toLowerCase() ===
                        currentFile.toLowerCase()
                    ) {
                        return false;
                    }

                    return true;
                })
                .sort((a, b) =>
                    a.name.localeCompare(
                        b.name,
                        undefined,
                        { sensitivity: "base" }
                    )
                );

            displayTools(tools);

        } catch (error) {

            console.error(error);

            toolsContainer.innerHTML = `
                <div class="error">
                    <strong>Unable to load tools.</strong><br><br>
                    ${escapeHtml(error.message)}
                </div>
            `;

            countElement.textContent = "";
        }
    }


    /*
     * Display tools.
     */
    function displayTools(list) {

        toolsContainer.innerHTML = "";

        countElement.textContent =
            `${list.length} tool${list.length === 1 ? "" : "s"} available`;

        if (list.length === 0) {

            toolsContainer.innerHTML = `
                <div class="status">
                    No HTML tools found in this folder.
                </div>
            `;

            return;
        }

        list.forEach(file => {

            const link = document.createElement("a");

            link.className = "tool";

            /*
             * GitHub Pages URL.
             *
             * We use a relative URL so the tool opens from
             * the same folder.
             */
            link.href =
                encodeURI(file.name);

            link.target = "_self";

            const name =
                file.name
                    .replace(/\.html$/i, "")
                    .replace(/[-_]/g, " ");

            link.innerHTML = `
                <div class="tool-icon">🔧</div>

                <div class="tool-name">
                    ${escapeHtml(toTitleCase(name))}
                </div>

                <div class="tool-file">
                    ${escapeHtml(file.name)}
                </div>
            `;

            toolsContainer.appendChild(link);
        });
    }


    /*
     * Search/filter tools.
     */
    searchInput.addEventListener("input", function () {

        const query =
            this.value
                .trim()
                .toLowerCase();

        const filtered = tools.filter(file =>
            file.name
                .toLowerCase()
                .includes(query)
        );

        displayTools(filtered);
    });


    /*
     * Convert filename to a nicer display name.
     *
     * Example:
     *
     * pdf_converter.html
     *
     * becomes:
     *
     * Pdf Converter
     */
    function toTitleCase(text) {

        return text.replace(
            /\w\S*/g,
            word =>
                word.charAt(0).toUpperCase() +
                word.slice(1).toLowerCase()
        );
    }


    /*
     * Prevent HTML injection when displaying filenames.
     */
    function escapeHtml(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    /*
     * Start.
     */
    loadTools();

</script>

</body>
</html>
