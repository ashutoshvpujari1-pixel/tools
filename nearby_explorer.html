<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Explorer - Hotels, Cinemas, Transit & More</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        #map { z-index: 10; }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 flex flex-col overflow-hidden">

    <header class="bg-white border-b border-slate-200 px-4 py-3 shadow-sm z-20 flex flex-col md:flex-row items-center justify-between gap-3 shrink-0">
        <div class="flex items-center space-x-3 w-full md:w-auto justify-between md:justify-start">
            <div class="flex items-center space-x-2">
                <div class="bg-indigo-600 text-white p-2 rounded-xl shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-compass text-xl animate-spin-slow"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-slate-900 leading-tight">Nearby Explorer</h1>
                    <p class="text-xs text-slate-500" id="location-status">Detecting your location...</p>
                </div>
            </div>
            <!-- Mobile Menu Toggle -->
            <button id="sidebar-toggle" class="md:hidden bg-indigo-50 text-indigo-600 px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-100 transition">
                <i class="fa-solid fa-bars mr-1"></i> List
            </button>
        </div>

        <!-- Search & Radius Bar -->
        <div class="flex items-center gap-2 w-full md:w-auto flex-wrap md:flex-nowrap">
            <div class="relative flex-1 md:w-64">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="custom-search-input" placeholder="Search places..." 
                    class="w-full pl-9 pr-4 py-2 bg-slate-100 border border-transparent rounded-xl text-sm focus:bg-white focus:border-indigo-500 focus:outline-none transition">
            </div>
            <div class="flex items-center space-x-1 bg-slate-100 p-1 rounded-xl">
                <span class="text-xs text-slate-500 px-2 font-medium hidden sm:inline">Radius:</span>
                <select id="radius-select" class="bg-white border border-slate-200 text-slate-700 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-1 focus:ring-indigo-500 font-medium">
                    <option value="1000">1 km</option>
                    <option value="3000" selected>3 km</option>
                    <option value="5000">5 km</option>
                    <option value="10000">10 km</option>
                </select>
            </div>
            <button id="recenter-btn" title="Reset to GPS Location" class="bg-slate-100 hover:bg-slate-200 text-slate-700 p-2 rounded-xl transition flex items-center justify-center text-sm">
                <i class="fa-solid fa-crosshairs text-indigo-600"></i>
            </button>
        </div>
    </header>

    <nav class="bg-white border-b border-slate-200 px-4 py-2 overflow-x-auto whitespace-nowrap z-20 shrink-0 custom-scrollbar flex items-center gap-2">
        <button class="category-pill active bg-indigo-600 text-white px-3.5 py-1.5 rounded-full text-xs font-semibold shadow-sm transition flex items-center gap-1.5" data-category="hotel">
            <i class="fa-solid fa-hotel"></i> Hotels & Lodging
        </button>
        <button class="category-pill bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-full text-xs font-semibold transition flex items-center gap-1.5" data-category="cinema">
            <i class="fa-solid fa-film"></i> Cinemas
        </button>
        <button class="category-pill bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-full text-xs font-semibold transition flex items-center gap-1.5" data-category="transit">
            <i class="fa-solid fa-bus"></i> Bus & Transit
        </button>
        <button class="category-pill bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-full text-xs font-semibold transition flex items-center gap-1.5" data-category="restaurant">
            <i class="fa-solid fa-utensils"></i> Restaurants
        </button>
        <button class="category-pill bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-full text-xs font-semibold transition flex items-center gap-1.5" data-category="pharmacy">
            <i class="fa-solid fa-pills"></i> Pharmacies
        </button>
        <button class="category-pill bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-full text-xs font-semibold transition flex items-center gap-1.5" data-category="atm">
            <i class="fa-solid fa-atm"></i> ATMs & Banks
        </button>
        <button class="category-pill bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-full text-xs font-semibold transition flex items-center gap-1.5" data-category="supermarket">
            <i class="fa-solid fa-cart-shopping"></i> Supermarkets
        </button>
    </nav>

    <main class="flex-1 flex relative overflow-hidden">
        <!-- Sidebar / Results Panel -->
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 w-full sm:w-96 bg-white border-r border-slate-200 flex flex-col z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-300 shadow-xl md:shadow-none">
            <div class="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50 shrink-0">
                <div>
                    <h2 class="font-bold text-slate-800 text-sm" id="results-title">Nearby Places</h2>
                    <p class="text-xs text-slate-500" id="results-count">Loading results...</p>
                </div>
                <button id="sidebar-close" class="md:hidden text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <!-- Place Cards Container -->
            <div id="places-container" class="flex-1 overflow-y-auto p-3 space-y-3 custom-scrollbar">
                <!-- Initial Loading State -->
                <div class="flex flex-col items-center justify-center py-16 text-center">
                    <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <p class="text-sm font-medium text-slate-600">Fetching live places from OpenStreetMap...</p>
                    <p class="text-xs text-slate-400 mt-1">Please ensure location access is permitted.</p>
                </div>
            </div>
        </aside>

        <!-- Leaflet Map Container -->
        <div id="map" class="flex-1 h-full w-full bg-slate-200"></div>
    </main>

    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2 pointer-events-none"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // State management
        const state = {
            lat: 18.5204, // Default to Pune, Maharashtra, India
            lng: 73.8567,
            locationName: "Pune, Maharashtra",
            radius: 3000,
            activeCategory: 'hotel',
            searchQuery: '',
            places: [],
            userMarker: null,
            searchCircle: null,
            markers: [],
            map: null
        };

        // Category definitions for Overpass API OSM tags
        const categoryQueries = {
            hotel: 'node["tourism"~"hotel|hostel|guest_house|motel"]',
            cinema: 'node["amenity"="cinema"]',
            transit: 'node["highway"="bus_stop"]',
            restaurant: 'node["amenity"~"restaurant|cafe|fast_food"]',
            pharmacy: 'node["amenity"="pharmacy"]',
            atm: 'node["amenity"~"atm|bank"]',
            supermarket: 'node["shop"~"supermarket|convenience|mall"]'
        };

        const categoryIcons = {
            hotel: { icon: 'fa-hotel', color: 'bg-amber-500' },
            cinema: { icon: 'fa-film', color: 'bg-rose-500' },
            transit: { icon: 'fa-bus', color: 'bg-blue-500' },
            restaurant: { icon: 'fa-utensils', color: 'bg-emerald-500' },
            pharmacy: { icon: 'fa-pills', color: 'bg-purple-500' },
            atm: { icon: 'fa-atm', color: 'bg-indigo-500' },
            supermarket: { icon: 'fa-cart-shopping', color: 'bg-teal-500' }
        };

        window.onload = function() {
            initMap();
            setupEventListeners();
            getUserLocation();
        };

        function initMap() {
            state.map = L.map('map', {
                zoomControl: false
            }).setView([state.lat, state.lng], 14);

            // Add clean CartoDB Positron tile layer
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
            }).addTo(state.map);

            // Add custom zoom control to top-right
            L.control.zoom({ position: 'topright' }).addTo(state.map);

            updateUserMarker();
        }

        function updateUserMarker() {
            if (state.userMarker) {
                state.map.removeLayer(state.userMarker);
            }
            if (state.searchCircle) {
                state.map.removeLayer(state.searchCircle);
            }

            // Custom pulsing user icon
            const userIcon = L.divIcon({
                className: 'custom-user-marker',
                html: `<div class="relative flex items-center justify-center">
                         <div class="absolute w-8 h-8 bg-indigo-500 rounded-full opacity-30 animate-ping"></div>
                         <div class="w-5 h-5 bg-indigo-600 border-2 border-white rounded-full shadow-lg flex items-center justify-center text-white text-[10px]">
                           <i class="fa-solid fa-user text-[8px]"></i>
                         </div>
                       </div>`,
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            state.userMarker = L.marker([state.lat, state.lng], { icon: userIcon }).addTo(state.map)
                .bindPopup(`<div class="font-bold text-xs">Your Location</div>`);

            state.searchCircle = L.circle([state.lat, state.lng], {
                radius: state.radius,
                color: '#6366f1',
                fillColor: '#6366f1',
                fillOpacity: 0.05,
                weight: 1,
                dashArray: '4, 4'
            }).addTo(state.map);
        }

        function setupEventListeners() {
            // Category pills click
            document.querySelectorAll('.category-pill').forEach(pill => {
                pill.addEventListener('click', (e) => {
                    document.querySelectorAll('.category-pill').forEach(p => {
                        p.classList.remove('bg-indigo-600', 'text-white', 'active');
                        p.classList.add('bg-slate-100', 'text-slate-600');
                    });
                    const target = e.currentTarget;
                    target.classList.remove('bg-slate-100', 'text-slate-600');
                    target.classList.add('bg-indigo-600', 'text-white', 'active');
                    
                    state.activeCategory = target.getAttribute('data-category');
                    fetchPlaces();

                    // Close sidebar on mobile after selection
                    if (window.innerWidth < 768) {
                        document.getElementById('sidebar').classList.add('-translate-x-full');
                    }
                });
            });

            // Radius change
            document.getElementById('radius-select').addEventListener('change', (e) => {
                state.radius = parseInt(e.target.value);
                updateUserMarker();
                fetchPlaces();
            });

            // Custom Search Input
            let searchTimeout;
            document.getElementById('custom-search-input').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                state.searchQuery = e.target.value.toLowerCase().trim();
                searchTimeout = setTimeout(() => {
                    renderPlaces();
                }, 300);
            });

            // Recenter Button
            document.getElementById('recenter-btn').addEventListener('click', () => {
                state.map.setView([state.lat, state.lng], 15, { animate: true });
                showToast("Centered to your location", "info");
            });

            // Sidebar mobile toggles
            document.getElementById('sidebar-toggle').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('-translate-x-full');
            });
            document.getElementById('sidebar-close').addEventListener('click', () => {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            });
        }

        function getUserLocation() {
            const statusEl = document.getElementById('location-status');
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        state.lat = position.coords.latitude;
                        state.lng = position.coords.longitude;
                        statusEl.textContent = "GPS Location Active";
                        state.map.setView([state.lat, state.lng], 14);
                        updateUserMarker();
                        fetchPlaces();
                    },
                    (error) => {
                        console.warn("Geolocation denied or error:", error.message);
                        statusEl.textContent = "Using default location (Pune)";
                        showToast("Location access denied. Using default location.", "warning");
                        updateUserMarker();
                        fetchPlaces();
                    },
                    { timeout: 10000, enableHighAccuracy: true }
                );
            } else {
                statusEl.textContent = "Geolocation not supported";
                fetchPlaces();
            }
        }

        async function fetchPlaces() {
            const container = document.getElementById('places-container');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-16 text-center">
                    <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <p class="text-sm font-medium text-slate-600">Fetching live places...</p>
                </div>
            `;

            const queryElement = categoryQueries[state.activeCategory] || categoryQueries.hotel;
            
            // Overpass API Query
            const overpassQuery = `
                [out:json][timeout:25];
                (
                  ${queryElement}(around:${state.radius},${state.lat},${state.lng});
                );
                out body;
                >;
                out skel qt;
            `;

            const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(overpassQuery)}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response failed');
                const data = await response.json();
                
                // Parse elements
                state.places = data.elements
                    .filter(el => el.tags && el.tags.name)
                    .map(el => {
                        const pLat = el.lat || (el.center && el.center.lat);
                        const pLon = el.lon || (el.center && el.center.lon);
                        const distance = calculateDistance(state.lat, state.lng, pLat, pLon);
                        return {
                            id: el.id,
                            name: el.tags.name,
                            lat: pLat,
                            lng: pLon,
                            tags: el.tags,
                            distance: distance
                        };
                    })
                    .sort((a, b) => a.distance - b.distance);

                renderPlaces();
                updateMapMarkers();
            } catch (err) {
                console.error("Overpass API error:", err);
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-12 text-center px-4">
                        <i class="fa-solid fa-triangle-exclamation text-amber-500 text-3xl mb-2"></i>
                        <p class="text-sm font-medium text-slate-700">Could not load places</p>
                        <p class="text-xs text-slate-400 mt-1">Please check your internet connection or try a different radius.</p>
                        <button onclick="fetchPlaces()" class="mt-4 bg-indigo-50 text-indigo-600 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-indigo-100 transition">Retry</button>
                    </div>
                `;
                showToast("Failed to fetch nearby places", "error");
            }
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; // Earth radius in km
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; // Distance in km
        }

        function renderPlaces() {
            const container = document.getElementById('places-container');
            const resultsCount = document.getElementById('results-count');
            
            // Filter by search query if present
            const filtered = state.places.filter(place => {
                if (!state.searchQuery) return true;
                const nameMatch = place.name.toLowerCase().includes(state.searchQuery);
                const brandMatch = place.tags.brand && place.tags.brand.toLowerCase().includes(state.searchQuery);
                const cuisineMatch = place.tags.cuisine && place.tags.cuisine.toLowerCase().includes(state.searchQuery);
                return nameMatch || brandMatch || cuisineMatch;
            });

            resultsCount.textContent = `${filtered.length} places found within ${(state.radius/1000).toFixed(1)} km`;

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 text-center px-4">
                        <i class="fa-solid fa-magnifying-glass text-slate-300 text-3xl mb-2"></i>
                        <p class="text-sm font-medium text-slate-700">No places found</p>
                        <p class="text-xs text-slate-400 mt-1">Try increasing your search radius or selecting another category.</p>
                    </div>
                `;
                return;
            }

            const catInfo = categoryIcons[state.activeCategory] || { icon: 'fa-location-dot', color: 'bg-indigo-500' };

            container.innerHTML = filtered.map((place, index) => {
                const distanceStr = place.distance < 1 
                    ? `${(place.distance * 1000).toFixed(0)} m` 
                    : `${place.distance.toFixed(1)} km`;

                const address = place.tags['addr:street'] || place.tags['addr:suburb'] || place.tags.operator || 'Address unavailable';
                const cuisine = place.tags.cuisine ? `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-[10px] font-medium mr-1"><i class="fa-solid fa-utensils mr-1"></i>${place.tags.cuisine}</span>` : '';
                const phone = place.tags['phone'] || place.tags['contact:phone'] ? `<span class="text-slate-500 text-xs flex items-center gap-1 mt-1"><i class="fa-solid fa-phone text-[10px]"></i> ${place.tags['phone'] || place.tags['contact:phone']}</span>` : '';

                return `
                    <div class="place-card bg-white border border-slate-100 hover:border-indigo-200 p-3.5 rounded-2xl shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between" data-index="${index}" onclick="focusPlace(${place.lat}, ${place.lng}, ${index})">
                        <div>
                            <div class="flex items-start justify-between gap-2">
                                <div class="flex items-start space-x-2.5">
                                    <div class="${catInfo.color} text-white w-8 h-8 rounded-xl flex items-center justify-center shrink-0 mt-0.5 shadow-sm">
                                        <i class="fa-solid ${catInfo.icon} text-xs"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-semibold text-slate-800 text-sm leading-tight">${place.name}</h3>
                                        <p class="text-xs text-slate-500 mt-0.5 flex items-center gap-1">
                                            <i class="fa-solid fa-location-dot text-[10px] text-slate-400"></i> ${address}
                                        </p>
                                    </div>
                                </div>
                                <span class="bg-indigo-50 text-indigo-700 font-semibold text-[11px] px-2 py-1 rounded-lg shrink-0">
                                    ${distanceStr}
                                </span>
                            </div>
                            <div class="mt-2.5 flex flex-wrap items-center gap-1">
                                ${cuisine}
                            </div>
                            ${phone}
                        </div>
                        <div class="mt-3 pt-2.5 border-t border-slate-100 flex items-center justify-between">
                            <span class="text-[11px] text-slate-400 capitalize">${state.activeCategory}</span>
                            <div class="flex items-center space-x-2">
                                <a href="https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}" target="_blank" onclick="event.stopPropagation()" class="bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 text-slate-600 px-2.5 py-1 rounded-lg text-xs font-medium transition flex items-center gap-1">
                                    <i class="fa-solid fa-diamond-turn-right"></i> Directions
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateMapMarkers() {
            // Clear existing markers
            state.markers.forEach(m => state.map.removeLayer(m));
            state.markers = [];

            const filtered = state.places.filter(place => {
                if (!state.searchQuery) return true;
                return place.name.toLowerCase().includes(state.searchQuery);
            });

            filtered.forEach((place, index) => {
                const markerHtml = `<div class="w-7 h-7 bg-white border-2 border-indigo-600 rounded-full shadow-md flex items-center justify-center text-indigo-600 font-bold text-xs hover:bg-indigo-600 hover:text-white transition">${index + 1}</div>`;
                
                const customIcon = L.divIcon({
                    className: 'custom-poi-marker',
                    html: markerHtml,
                    iconSize: [28, 28],
                    iconAnchor: [14, 14]
                });

                const marker = L.marker([place.lat, place.lng], { icon: customIcon }).addTo(state.map);
                
                marker.bindPopup(`
                    <div class="p-1">
                        <h4 class="font-bold text-xs text-slate-900">${place.name}</h4>
                        <p class="text-[11px] text-slate-500 mt-0.5">${place.tags['addr:street'] || state.activeCategory}</p>
                        <a href="https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lng}" target="_blank" class="mt-2 inline-block bg-indigo-600 text-white px-2 py-1 rounded text-[10px] font-medium">Get Directions</a>
                    </div>
                `);

                marker.on('click', () => {
                    highlightCard(index);
                });

                state.markers.push(marker);
            });
        }

        function focusPlace(lat, lng, index) {
            state.map.setView([lat, lng], 16, { animate: true });
            if (state.markers[index]) {
                state.markers[index].openPopup();
            }
            highlightCard(index);

            // On mobile, auto-close sidebar to view map
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        }

        function highlightCard(index) {
            const cards = document.querySelectorAll('.place-card');
            cards.forEach(c => c.classList.remove('ring-2', 'ring-indigo-500', 'bg-indigo-50/30'));
            const targetCard = document.querySelector(`.place-card[data-index="${index}"]`);
            if (targetCard) {
                targetCard.classList.add('ring-2', 'ring-indigo-500', 'bg-indigo-50/30');
                targetCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bg = 'bg-slate-800 text-white';
            if (type === 'error') bg = 'bg-rose-600 text-white';
            if (type === 'warning') bg = 'bg-amber-600 text-white';
            if (type === 'info') bg = 'bg-indigo-600 text-white';

            toast.className = `${bg} px-4 py-2.5 rounded-xl shadow-lg text-xs font-medium pointer-events-auto transform translate-y-2 opacity-0 transition-all duration-300 flex items-center space-x-2`;
            toast.innerHTML = `<span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
